services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    image: redgate/flyway:11.20.0
    platform: linux/amd64
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/marketplace
      FLYWAY_USER: marketplace
      FLYWAY_PASSWORD: marketplace
      FLYWAY_CONNECT_RETRIES: 30
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      DATABASE_URL: postgresql://marketplace:marketplace@db:5432/marketplace
      JWT_SECRET: ${JWT_SECRET:-local-homework-secret-at-least-32-characters}
      ORDER_INTERVAL_MINUTES: ${ORDER_INTERVAL_MINUTES:-1}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
